<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>时期详情 · 四川大学院系历史沿革</title>
<style>
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#fafafa; margin:0; color:#222; }
  .wrap { max-width:860px; margin:24px auto; padding:0 16px 48px; }
  .crumb { font-size:12px; color:#666; margin-bottom:8px; }
  .crumb a { color:#1a4e8a; text-decoration:none; }
  .crumb a:hover { color:#c7443a; text-decoration:underline; }
  .card { background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:20px 24px; }
  h1 { font-size:22px; margin:0 0 6px 0; }
  .meta { color:#666; font-size:13px; margin-bottom:14px; }
  .chip { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:5px; border:1px solid rgba(0,0,0,.15); }
  .ghost { color:#a06a00; font-size:12px; margin-left:8px; }
  h2 { font-size:15px; margin:20px 0 8px; padding-left:10px; border-left:3px solid #c7443a; }
  p, li { font-size:14px; line-height:1.9; }
  ul { margin:4px 0; padding-left:22px; }
  .nav { margin-top:24px; font-size:13px; }
  .nav a { color:#1a4e8a; text-decoration:none; margin-right:16px; }
  .nav a:hover { color:#c7443a; text-decoration:underline; }
  .todo { color:#999; font-size:13px; }
  .src { margin:4px 0; padding-left:22px; }
  .src li { font-size:13px; color:#555; line-height:1.7; margin-bottom:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb" id="crumb"></div>
  <div class="card" id="card"></div>
</div>

<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const name = q.get("c") || "";
const pi = q.has("p") ? parseInt(q.get("p"), 10) : -1;
const row = ROWS.find(r => r.name === name);
const crumb = document.getElementById("crumb");
const card = document.getElementById("card");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cUrl = n => "college.html?c=" + encodeURIComponent(n);

if (!row || pi < 0 || !row.blocks[pi]) {
  crumb.innerHTML = '<a href="index.html">← 返回全景图</a>';
  card.innerHTML = "<h1>未找到该时期</h1><p class='todo'>参数有误，请从全景图或学院页进入。</p>";
} else {
  const b = row.blocks[pi];
  const key = row.name + "|" + b.s;
  const d = (typeof DETAILS !== "undefined") ? DETAILS[key] : null;
  const dur = b.e - b.s;
  document.title = row.name + " · " + b.label + "（" + b.s + "—" + b.e + "）";
  crumb.innerHTML = '<a href="index.html">全景图</a>　/　<a href="' + cUrl(row.name) + '">' + esc(row.name) + "</a>　/　" + esc(b.label);

  let html = "<h1>" + esc(row.name) + " · " + esc(b.label) + "</h1>";
  html += '<div class="meta"><span class="chip" style="background:' + COLORS[b.c].c + '"></span>'
    + "所属母体：" + esc(COLORS[b.c].name) + "　·　起止：<b>" + b.s + "—" + b.e + "</b>（约 " + dur + " 年）"
    + (b.ghost ? '<span class="ghost">注：此为筹建/中断期</span>' : "") + "</div>";

  if (d) {
    if (d.summary) html += "<h2>概述</h2><p>" + esc(d.summary) + "</p>";
    if (d.events && d.events.length) html += "<h2>大事记</h2><ul>" + d.events.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>";
    if (d.achievements && d.achievements.length) html += "<h2>主要成就</h2><ul>" + d.achievements.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>";
    if (d.people && d.people.length) html += "<h2>代表人物</h2><ul>" + d.people.map(t => {
    const m = t.match(/^[^（—-]+/); const nm = m ? m[0].trim() : t; const rest = t.slice(nm.length);
    const nmHtml = PEOPLE_LINKS[nm] ? '<a href="' + (PEOPLE_LINKS[nm] === 1 ? 'https://baike.baidu.com/item/' + encodeURIComponent(nm) : PEOPLE_LINKS[nm]) + '" target="_blank" rel="noopener" title="查看百科词条（内容仅供参考）" style="color:#1a4e8a;border-bottom:1px dotted #1a4e8a;text-decoration:none;">' + esc(nm) + '</a>' : esc(nm);
    return "<li>" + nmHtml + esc(rest) + "</li>";
  }).join("") + "</ul>";
    if (d.sources && d.sources.length) html += "<h2>资料来源</h2><ol class='src'>" + d.sources.map(t => "<li>" + esc(t) + "</li>").join("") + "</ol>";
  } else {
    html += '<p class="todo">该时期的详细事件与成就资料正在补充中。以下为图数据基本信息：</p>';
    html += "<ul><li>时期名称：" + esc(b.label) + "</li><li>起止年份：" + b.s + "—" + b.e
      + "</li><li>所属母体：" + esc(COLORS[b.c].name) + "</li></ul>";
  }

  // 本时期内的并/分事件
  const marks = EVMARKS.filter(m => m.row === row.name && m.y >= b.s && m.y < b.e);
  if (marks.length) {
    html += "<h2>本时期并/分事件</h2><ul>" + marks.map(m =>
      "<li><b style='color:" + (m.t === "并" ? "#c7443a" : "#2f8f5b") + "'>" + m.t + "</b>　"
      + m.y + "年：" + esc(m.note || "") + "</li>").join("") + "</ul>";
  }

  // 上一个/下一个时期导航
  html += '<div class="nav">';
  if (pi > 0) {
    const pb = row.blocks[pi - 1];
    html += '<a href="period.html?c=' + encodeURIComponent(row.name) + "&p=" + (pi - 1) + '">← 上一时期：' + esc(pb.label) + "（" + pb.s + "—" + pb.e + "）</a>";
  }
  if (pi < row.blocks.length - 1) {
    const nb = row.blocks[pi + 1];
    html += '<a href="period.html?c=' + encodeURIComponent(row.name) + "&p=" + (pi + 1) + '">下一时期：' + esc(nb.label) + "（" + nb.s + "—" + nb.e + "）→</a>";
  }
  html += '<a href="' + cUrl(row.name) + '" style="float:right">返回「' + esc(row.name) + '」学院页</a></div>';
  card.innerHTML = html;
}
</script>
</body>
</html>
