<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学院页 · 四川大学院系历史沿革</title>
<style>
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#fff; margin:16px; color:#222; }
  .crumb { font-size:12px; color:#666; margin-bottom:6px; }
  .crumb a { color:#1a4e8a; text-decoration:none; }
  .crumb a:hover { color:#c7443a; text-decoration:underline; }
  h1 { font-size:20px; margin:0 0 4px 0; }
  .sub { color:#666; font-size:12px; margin-bottom:12px; max-width:900px; }
  svg text { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; }
  svg a rect { cursor:pointer; }
  svg a:hover rect { filter:brightness(1.08); }
  svg a:hover text { fill:#c7443a; }
  .foot { color:#888; font-size:12px; margin-top:14px; max-width:900px; }
</style>
</head>
<body>
<div class="crumb"><a href="index.html">← 返回全景图</a>　<span id="crumbName"></span></div>
<h1 id="title"></h1>
<div class="sub" id="subtitle"></div>
<svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="foot">颜色含义与全景图一致（蓝=四川大学，紫=四川联合大学，橙=成都工学院/成都科学技术大学，粉=华西系，绿=四川化学工业学院，灰褐=其他来源）；半透明色块=筹建/中断期；表头区浅色=早于 1896 年基线的源头期。点击色块或右侧条目进入该时期详情页。</div>

<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const name = q.get("c") || "";
const focusP = q.has("p") ? parseInt(q.get("p"), 10) : -1;
const row = ROWS.find(r => r.name === name);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const svg = document.getElementById("chart");
if (!row) {
  document.getElementById("title").textContent = "未找到学院：" + name;
  document.getElementById("subtitle").textContent = "请从全景图页面点击进入。";
} else {
  document.title = row.name + " · 四川大学院系历史沿革";
  document.getElementById("crumbName").textContent = GROUPS[row.g] + " / " + row.name;
  document.getElementById("title").textContent = row.name;
  document.getElementById("subtitle").textContent =
    "所属分组：" + GROUPS[row.g] + "　·　共 " + row.blocks.length + " 个历史时期　·　点击任意时期条目查看详细事件与成就";

  const YEAR0 = 1896, YEAR1 = 2026;
  const ROW_H = 12, LEFT_W = 56, BAR_X = 70, BAR_W = 170, TOP_PAD = 14;
  const GRID_H = (YEAR1 - YEAR0) * ROW_H;
  const GRID_Y = TOP_PAD + 8;
  const W = BAR_X + BAR_W + 460, H = GRID_Y + GRID_H + 30;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const yPx = y => GRID_Y + (y - YEAR0) * ROW_H;

  // 年份轴
  for (let y = YEAR0; y <= YEAR1; y++) {
    const major = (y % 10 === 0);
    svg.appendChild(el("text", { x:LEFT_W-6, y:yPx(y)+ROW_H-2, "text-anchor":"end",
      "font-size": major?10:8, fill: major?"#333":"#b0b0b0" }, y));
    if (major) svg.appendChild(el("line", { x1:LEFT_W, y1:yPx(y), x2:BAR_X+BAR_W+440, y2:yPx(y),
      stroke:"#eeeeee", "stroke-width":1 }));
  }
  // 1896 基线
  svg.appendChild(el("line", { x1:LEFT_W, y1:GRID_Y, x2:BAR_X+BAR_W+440, y2:GRID_Y, stroke:"#999", "stroke-width":1 }));

  // 时期色块
  row.blocks.forEach((b, bi) => {
    const cFill = COLORS[b.c].c;
    const tip = row.name + "：" + b.label + "（" + b.s + "—" + b.e + "）";
    const yTop = yPx(b.s), yBot = yPx(b.e);
    // 1896 之前的源头段（浅色，画在基线上方）
    if (b.s < YEAR0) {
      const pre = el("rect", { x:BAR_X, y:yTop, width:BAR_W, height:GRID_Y - yTop, fill:cFill, opacity:0.28 });
      pre.appendChild(el("title", {}, tip));
      svg.appendChild(pre);
      svg.appendChild(el("text", { x:BAR_X+BAR_W+14, y:(yTop+GRID_Y)/2+4, "font-size":12, fill:"#666" },
        b.label + "（源头期 " + b.s + "—" + Math.min(b.e, YEAR0) + "）"));
    }
    // 1994-98 川联大拆分（与全景图一致）
    const parts = [];
    if (b.c === "scu") {
      const a = Math.max(b.s, YEAR0), z = b.e;
      if (Math.min(z,1994) > a) parts.push({s:a, e:Math.min(z,1994), c:"scu"});
      if (Math.min(z,1998) > Math.max(a,1994)) parts.push({s:Math.max(a,1994), e:Math.min(z,1998), c:"scul"});
      if (z > Math.max(a,1998)) parts.push({s:Math.max(a,1998), e:z, c:"scu"});
    } else {
      parts.push({s:Math.max(b.s, YEAR0), e:b.e, c:b.c});
    }
    const vTop = Math.max(yTop, GRID_Y), vBot = Math.min(yBot, GRID_Y + GRID_H);
    if (vBot > vTop) {
      const link = el("a", { href:"period.html?c=" + encodeURIComponent(row.name) + "&p=" + bi });
      parts.forEach(p => {
        const py = Math.max(yPx(p.s), GRID_Y), py2 = Math.min(yPx(p.e), GRID_Y + GRID_H);
        if (py2 <= py) return;
        const rect = el("rect", { x:BAR_X, y:py, width:BAR_W, height:py2-py,
          fill:COLORS[p.c].c, opacity: b.ghost ? 0.4 : 1 });
        if (bi === focusP) { rect.setAttribute("stroke", "#c7443a"); rect.setAttribute("stroke-width", 2); }
        rect.appendChild(el("title", {}, tip + "\n点击查看该时期详情"));
        link.appendChild(rect);
      });
      // 右侧条目文字
      const cy = (vTop + vBot) / 2;
      const t1 = el("text", { x:BAR_X+BAR_W+14, y:cy-2, "font-size":13, "font-weight":600, fill:"#222" }, b.label);
      const t2 = el("text", { x:BAR_X+BAR_W+14, y:cy+13, "font-size":11, fill:"#888" },
        b.s + "—" + b.e + "　·　" + COLORS[b.c].name + (b.ghost ? "（筹建/中断期）" : "") + "　→ 详情");
      link.appendChild(t1); link.appendChild(t2);
      svg.appendChild(link);
    }
  });
  // 并/分事件圆点
  EVMARKS.forEach(m => {
    if (m.row !== row.name) return;
    const b = row.blocks.find(bb => m.y >= bb.s && m.y < bb.e);
    if (!b) return;
    const cy = yPx(m.y);
    const dot = el("circle", { cx:BAR_X+BAR_W/2, cy:cy, r:8, fill: m.t==="并" ? "#c7443a" : "#2f8f5b",
      stroke:"#fff", "stroke-width":1.5 });
    dot.appendChild(el("title", {}, row.name + " " + m.y + "年 · " + (m.t==="并"?"并入/合组":"分出/调出") + "：" + (m.note||"")));
    svg.appendChild(dot);
    svg.appendChild(el("text", { x:BAR_X+BAR_W/2, y:cy+3.8, "text-anchor":"middle",
      "font-size":10.5, "font-weight":700, fill:"#fff", "pointer-events":"none" }, m.t));
    svg.appendChild(el("text", { x:BAR_X+BAR_W/2+14, y:cy+4, "font-size":11, fill:"#555" },
      m.y + " " + (m.note || (m.t==="并"?"并入/合组":"分出/调出"))));
  });

  // 定位高亮时期（从全景图点色块进入时）
  if (focusP >= 0 && row.blocks[focusP]) {
    const b = row.blocks[focusP];
    const y = Math.max(yPx(Math.max(b.s, YEAR0)) - 80, 0);
    setTimeout(() => window.scrollTo({ top: y, behavior: "smooth" }), 100);
  }
}
</script>
</body>
</html>
