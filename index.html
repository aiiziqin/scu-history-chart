// 重大事件注记（渲染为图表下方列表）
const EVENTS = [
  "<b>1952-1953 院系调整流出：</b>法律/政治系→西南革大（1953组建西南政法学院）；经济系科→四川财经学院（今西南财经大学）；航空系调出；化工线糖品物工学调华南工学院、造纸工学并入天津大学",
  "<b>1950-1952 院系调整流入：</b>重庆大学/川北大学/华西协合大学化学系并入化学系；重大/华西数学师资并入数学系；华西生物系并入生物系；十校化工系科合组四川化学工业学院",
  "<b>1994：</b>四川大学+成都科技大学合并为四川联合大学；1998年更名四川大学；<b>2000：</b>华西医科大学并入组建新四川大学",
  "<b>2000-2001 组建潮：</b>华西基础化学教研室→化学学院；华西外语系→外国语学院；华西人文社科部→政治学院（今马克思主义学院）；基础医学院+法医学院→华西基础医学与法医学院；材料/高分子/建环/工商管理等学院组建",
  "<b>实体研究院所：</b>原子核科学技术研究所/720所（1980，教育部与二机部批准，前身1972七二〇工程）；原子与分子物理研究所（1984，芶清泉创建于成都科大）；宗教学研究所（1980，卿希泰，高校首个）→道教与宗教文化研究所（1999更名）；古籍整理研究所（1983，教育部首批）；中国藏学研究所（1999）",
  "<b>2024-2026：</b>文学与新闻学院分设为文学院、新闻传播与出版学院；古典学系成立（2025.3）；人工智能学院揭牌（2026.1）"
];
// ============ 渲染区（v0.4 极简网格版·对齐参考图） ============
const YEAR0 = 1896, YEAR1 = 2026;
const COL_W = 22, ROW_H = 8, LEFT_W = 50, TOP_PAD = 10;
const GROUP_FILL = { base:"#f2f2f2", sci:"#EAF3FB", eng:"#FDF3E3", med:"#FBEAEE", lib:"#F1EDF9", res:"#EAF6F0" };

// 合并/拆分事件标记：t=并(并入/合组) 分(分出/调出)；渲染为事件年分界处的圆点
const EVMARKS = [
  {row:"数学学院",y:1952,t:"并",note:"重庆大学/华西数学师资并入"},
  {row:"物理学院",y:2000,t:"并",note:"华西物理力量并入"},
  {row:"化学学院",y:1952,t:"并",note:"重庆大学/川北大学/华西化学系并入"},
  {row:"化学学院",y:2000,t:"并",note:"华西基础化学教研室并入"},
  {row:"生命科学学院",y:1952,t:"并",note:"华西协合大学生物系并入"},
  {row:"化学工程学院",y:1952,t:"并",note:"十校化工系科合组四川化学工业学院"},
  {row:"轻工科学与工程学院",y:1952,t:"并",note:"燕京大学制革学系内迁（张铨）"},
  {row:"外国语学院",y:1994,t:"并",note:"成都科大外语系并入"},
  {row:"外国语学院",y:2000,t:"并",note:"华西医大外语教研室并入"},
  {row:"电气工程学院",y:1998,t:"并",note:"电力/自动化/应电三系合建学院"},
  {row:"水利水电学院",y:1993,t:"分",note:"土木工程专业分出"},
  {row:"空天科学与工程学院",y:1952,t:"分",note:"航空系整体调出"},
  {row:"法学院",y:1952,t:"分",note:"法律/政治系调出，组建西南政法学院"},
  {row:"经济学院",y:1952,t:"分",note:"经济系科调四川财经学院（今西南财大）"},
  {row:"新闻传播与出版学院",y:1998,t:"并",note:"并入文学与新闻学院"},
  {row:"文学院（中文系）",y:2024,t:"分",note:"文学与新闻学院分设为文学院、新闻传播与出版学院"},
  {row:"马克思主义学院",y:2001,t:"并",note:"并华西医科大学人文社科部"},
  {row:"华西基础医学与法医学院",y:2001,t:"并",note:"基础医学院+法医学院合并组建"}
];

const COLS = ROWS.filter(r => r.g !== "base"); // 三条校本部基线用颜色体现，不占列
const NAME_H = Math.max.apply(null, COLS.map(r => r.name.length)) * 13 + 10;
const GROUP_H = 24;
const GRID_W = COLS.length * COL_W;
const GRID_H = (YEAR1 - YEAR0) * ROW_H;
const GRID_X = LEFT_W, GRID_Y = TOP_PAD + GROUP_H + NAME_H;
const W = GRID_X + GRID_W + 60;
const H = GRID_Y + GRID_H + 40;

const svg = document.getElementById("chart");
svg.setAttribute("width", W); svg.setAttribute("height", H);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
const yPx = y => GRID_Y + (y - YEAR0) * ROW_H;

// 1) 学部色带表头（同列分组的 Excel 大标题）
const groupBounds = [];
let gi = 0;
while (gi < COLS.length) {
  let gj = gi; while (gj < COLS.length && COLS[gj].g === COLS[gi].g) gj++;
  groupBounds.push([gi, gj]);
  const gx = GRID_X + gi * COL_W, gw = (gj - gi) * COL_W;
  svg.appendChild(el("rect", { x:gx, y:TOP_PAD, width:gw, height:GROUP_H,
    fill:GROUP_FILL[COLS[gi].g] || "#eeeeee" }));
  svg.appendChild(el("text", { x:gx+gw/2, y:TOP_PAD+GROUP_H/2+4.5, "text-anchor":"middle",
    "font-size":12.5, "font-weight":600, fill:"#333" }, GROUPS[COLS[gi].g]));
  gi = gj;
}

// 2) 列底（白色，未建校年份为白）；院名文字移到色块之后绘制，保证不被遮挡
COLS.forEach((row, ci) => {
  svg.appendChild(el("rect", { x:GRID_X+ci*COL_W, y:GRID_Y, width:COL_W, height:GRID_H, fill:"#ffffff" }));
});

// 3) 年份行：每行一年，同参考图左侧逐年标号
for (let y = YEAR0; y <= YEAR1; y++) {
  const major = (y % 10 === 0);
  svg.appendChild(el("text", { x:LEFT_W-6, y:yPx(y)+ROW_H-1, "text-anchor":"end",
    "font-size": major?8:6.8, fill: major?"#333":"#a0a0a0", "font-weight": major?700:400 }, String(y)));
}

// 4) 色块：每学院每年一格，颜色 = 当时所属母体。
//    早于基线(1896)的源头段（如 尊经书院1875）以淡色(28%)显示在表头区，院名文字在其上层绘制
const gridLayer = el("g");

COLS.forEach((row, ci) => {
  const x = GRID_X + ci * COL_W;
  row.blocks.forEach(b => {
    const yTop = yPx(b.s), yBot = yPx(b.e);
    const cFill = COLORS[b.c].c;
    const tip = row.name + "：" + b.label + "（" + b.s + "—" + b.e + "）" + (b.ghost ? "〔筹建/中断〕" : "");
    if (yTop < GRID_Y) { // 源头段早于基线：淡色显示，避免盖住表头
      const pre = el("rect", { x:x, y:yTop, width:COL_W, height:GRID_Y - yTop,
        fill:cFill, opacity:0.28 });
      pre.appendChild(el("title", {}, tip));
      gridLayer.appendChild(pre);
    }
    const mainTop = Math.max(yTop, GRID_Y);
    // 时期统一设色：1994-1998 四川联合大学窗口内，原川大(scu)块统一显示为川联大紫色（华西线除外，其时仍为独立学校）
    const parts = [];
    if (b.c === "scu") {
      const a = Math.max(b.s, YEAR0), z = b.e;
      if (Math.min(z,1994) > a) parts.push({s:a, e:Math.min(z,1994), c:"scu"});
      if (Math.min(z,1998) > Math.max(a,1994)) parts.push({s:Math.max(a,1994), e:Math.min(z,1998), c:"scul"});
      if (z > Math.max(a,1998)) parts.push({s:Math.max(a,1998), e:z, c:"scu"});
    } else {
      parts.push({s:Math.max(b.s, YEAR0), e:b.e, c:b.c});
    }
    parts.forEach(p => {
      const py = Math.max(yPx(p.s), GRID_Y), py2 = Math.min(yPx(p.e), GRID_Y + GRID_H);
      if (py2 <= py) return;
      const rect = el("rect", { x:x, y:py, width:COL_W, height:py2 - py,
        fill:COLORS[p.c].c, opacity: b.ghost ? 0.4 : 1 });
      rect.appendChild(el("title", {}, tip));
      gridLayer.appendChild(rect);
    });
    // 块内竖排名称：常规字重、去括号短标，按网格内可见范围居中，放得下才显示
    const disp = b.label.replace(/（[^）]*）|\([^)]*\)/g, "").trim();
    const step = 11.5;
    const vTop = Math.max(yTop, GRID_Y), vBot = Math.min(yBot, GRID_Y + GRID_H);
    if (disp.length >= 2 && disp.length * step <= (vBot - vTop) - 4) {
      const y0 = (vTop + vBot)/2 - (disp.length-1)*step/2 + 3.5;
      [...disp].forEach((ch, i) => gridLayer.appendChild(el("text", {
        x:x+COL_W/2, y:y0+i*step, "text-anchor":"middle", "font-size":9.5,
        fill:"#262626", "pointer-events":"none" }, ch)));
    }
  });
});
svg.appendChild(gridLayer);

// 4.5) 学院名竖排表头（绘制在色块之上，浅色源头段不会遮挡文字）
COLS.forEach((row, ci) => {
  const cx = GRID_X + ci * COL_W + COL_W / 2;
  [...row.name].forEach((ch, i) => {
    svg.appendChild(el("text", { x:cx, y:TOP_PAD+GROUP_H+16+i*13, "text-anchor":"middle",
      "font-size":12, "font-weight":500, fill:"#222" }, ch));
  });
});

// 5) 合并/拆分标记：事件年分界处圆点（红=并入/合组，绿=分出/调出），悬停看详情
COLS.forEach((row, ci) => {
  const x = GRID_X + ci * COL_W;
  EVMARKS.forEach(m => {
    if (m.row !== row.name) return;
    const b = row.blocks.find(bb => m.y >= bb.s && m.y < bb.e);
    if (!b) return;
    const cy = yPx(m.y);
    const dot = el("circle", { cx:x+COL_W/2, cy:cy, r:5.5, fill: m.t==="并" ? "#c7443a" : "#2f8f5b",
      stroke:"#fff", "stroke-width":1 });
    dot.appendChild(el("title", {}, row.name + " " + m.y + "年 · " + (m.t==="并"?"并入/合组":"分出/调出") + "：" + (m.note||"")));
    svg.appendChild(dot);
    svg.appendChild(el("text", { x:x+COL_W/2, y:cy+2.7, "text-anchor":"middle",
      "font-size":7.5, "font-weight":700, fill:"#fff", "pointer-events":"none" }, m.t));
  });
});

// 6) 参考图式极简处理：无分隔粗线、无红虚线、无外框 —— 合并/拆分由并分圆点与配色变化体现

// 7) 图例与事件注记
const lg = document.getElementById("legend");
for (const k in COLORS) {
  const sp = document.createElement("span");
  sp.innerHTML = `<i style="background:${COLORS[k].c}"></i>${COLORS[k].name}`;
  lg.appendChild(sp);
}
const mk1 = document.createElement("span");
mk1.innerHTML = `<i class="mk" style="background:#c7443a">并</i>并入/合组`;
lg.appendChild(mk1);
const mk2 = document.createElement("span");
mk2.innerHTML = `<i class="mk" style="background:#2f8f5b">分</i>分出/调出`;
lg.appendChild(mk2);
const ev = document.getElementById("events");
ev.innerHTML = "关键事件注记：" + EVENTS.map(t => `<li>${t}</li>`).join("");
